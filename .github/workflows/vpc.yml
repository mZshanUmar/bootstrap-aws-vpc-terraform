name: Deploy VPC

on:
  workflow_dispatch:
    inputs:
      deployment_action:
        description: Run a plan only or apply the changes
        type: choice
        options:
          - plan
          - apply
        default: plan
        required: true
      aws_region:
        description: AWS region
        type: string
        default: us-east-1
        required: true
      vpc_name:
        description: VPC name
        type: string
        default: example-vpc
        required: true
      vpc_cidr:
        description: VPC IPv4 CIDR
        type: string
        default: 10.0.0.0/16
        required: true
      public_subnets:
        description: Public subnet JSON object; use {} for none
        type: string
        default: '{"public-a":{"cidr_block":"10.0.1.0/24","availability_zone":"us-east-1a"}}'
        required: true
      private_subnets:
        description: Private subnets as a JSON object; use {} for none
        type: string
        default: '{"private-a":{"cidr_block":"10.0.11.0/24","availability_zone":"us-east-1a"},"private-b":{"cidr_block":"10.0.12.0/24","availability_zone":"us-east-1b"}}'
        required: true
      nat_gateway_mode:
        description: NAT gateways incur hourly and data processing costs
        type: choice
        options:
          - None
          - Zonal
          - Regional
        default: None
        required: true
      zonal_nat_gateway_availability_zones:
        description: JSON AZ list for Zonal NAT (null uses all private-subnet AZs; [] disables zonal NAT)
        type: string
        default: "null"
        required: true
      enable_s3_endpoint:
        description: Create an S3 gateway endpoint for private subnets
        type: boolean
        default: false
        required: true
      enable_dns_support:
        description: Enable VPC DNS support (Whether the VPC supports DNS resolution using the Amazon-provided resolver)
        type: boolean
        default: true
        required: true
      enable_dns_hostnames:
        description: Enable VPC DNS hostnames (Whether instances in the VPC are assigned DNS hostnames)
        type: boolean
        default: true
        required: true
      tags:
        description: Additional resource tags as a JSON object
        type: string
        default: "{}"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-vpc
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform ${{ inputs.deployment_action }}
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ inputs.aws_region }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
      PUBLIC_SUBNETS_JSON: ${{ inputs.public_subnets }}
      PRIVATE_SUBNETS_JSON: ${{ inputs.private_subnets }}
      NAT_GATEWAY_MODE: ${{ inputs.nat_gateway_mode }}
      ZONAL_NAT_GATEWAY_AVAILABILITY_ZONES_JSON: ${{ inputs.zonal_nat_gateway_availability_zones }}
      ENABLE_S3_ENDPOINT: ${{ inputs.enable_s3_endpoint }}
      TAGS_JSON: ${{ inputs.tags }}
      ENABLE_DNS_SUPPORT: ${{ inputs.enable_dns_support }}
      ENABLE_DNS_HOSTNAMES: ${{ inputs.enable_dns_hostnames }}
      VPC_NAME: ${{ inputs.vpc_name }}
      VPC_CIDR: ${{ inputs.vpc_cidr }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create Terraform variable file
        shell: bash
        run: |
          set -euo pipefail
          public_subnets="$(jq -ce 'if type == "object" then . else error("must be a JSON object") end' <<< "$PUBLIC_SUBNETS_JSON")"
          private_subnets="$(jq -ce 'if type == "object" then . else error("must be a JSON object") end' <<< "$PRIVATE_SUBNETS_JSON")"
          zonal_nat_gateway_availability_zones="$(jq -c 'if . == null or (type == "array" and all(.[]; type == "string")) then . else error("must be null or a JSON array of strings") end' <<< "$ZONAL_NAT_GATEWAY_AVAILABILITY_ZONES_JSON")"
          tags="$(jq -ce 'if type == "object" then . else error("must be a JSON object") end' <<< "$TAGS_JSON")"
          jq -n \
            --arg aws_region "$AWS_REGION" \
            --arg vpc_name "$VPC_NAME" \
            --arg vpc_cidr "$VPC_CIDR" \
            --argjson public_subnets "$public_subnets" \
            --argjson private_subnets "$private_subnets" \
            --arg nat_gateway_mode "$NAT_GATEWAY_MODE" \
            --argjson zonal_nat_gateway_availability_zones "$zonal_nat_gateway_availability_zones" \
            --argjson enable_s3_endpoint "$ENABLE_S3_ENDPOINT" \
            --argjson enable_dns_support "$ENABLE_DNS_SUPPORT" \
            --argjson enable_dns_hostnames "$ENABLE_DNS_HOSTNAMES" \
            --argjson tags "$tags" \
            '{
              aws_region: $aws_region,
              vpc_name: $vpc_name,
              vpc_cidr: $vpc_cidr,
              public_subnets: $public_subnets,
              private_subnets: $private_subnets,
              nat_gateway_mode: $nat_gateway_mode,
              zonal_nat_gateway_availability_zones: $zonal_nat_gateway_availability_zones,
              enable_s3_endpoint: $enable_s3_endpoint,
              enable_dns_support: $enable_dns_support,
              enable_dns_hostnames: $enable_dns_hostnames,
              tags: $tags
            }' > terraform.tfvars.json

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform changes
        run: terraform plan -input=false

      - name: Apply Terraform changes
        if: inputs.deployment_action == 'apply'
        run: terraform apply -auto-approve -input=false

      - name: Show Terraform outputs
        if: inputs.deployment_action == 'apply'
        run: terraform output
